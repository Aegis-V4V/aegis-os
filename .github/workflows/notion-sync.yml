name: "🥞 Sync to Notion on push"

# Fires on every push to any branch.
# Updates Last Commit Date, Freshness, and Last Synced for this repo
# in the STAX HQ Repos DB — within seconds of a git push.

on:
  push:
    branches: ["**"]

jobs:
  notion-sync:
    name: Update Notion repo record
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Patch Notion record
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python3 - <<'PYEOF'
          import os, sys, requests
          from datetime import datetime, timezone

          token = os.environ["NOTION_TOKEN"]
          repo  = os.environ["REPO_NAME"]

          # Convert repo name to slug (mirrors github_sync._to_slug)
          slug  = repo.lower().replace("_", "-").replace(" ", "-")

          # Slug aliases — keep in sync with ops/github_sync.py
          ALIASES = {
              "antigravity-assayer": "aegis",
          }
          slug = ALIASES.get(slug, slug)

          today = datetime.now(timezone.utc).date().isoformat()

          headers = {
              "Authorization": f"Bearer {token}",
              "Notion-Version": "2022-06-28",
              "Content-Type": "application/json",
          }

          # Find the Notion page by Slug field
          resp = requests.post(
              "https://api.notion.com/v1/databases/dba9f8e1777e4cb98e8ff7a68eb8003e/query",
              headers=headers,
              json={"filter": {"property": "Slug", "rich_text": {"equals": slug}}},
              timeout=15,
          )
          resp.raise_for_status()
          results = resp.json().get("results", [])

          if not results:
              print(f"No Notion record found for slug '{slug}' — skipping.")
              sys.exit(0)

          page_id = results[0]["id"]

          patch = requests.patch(
              f"https://api.notion.com/v1/pages/{page_id}",
              headers=headers,
              json={
                  "properties": {
                      "Last Commit Date": {"date": {"start": today}},
                      "Last Synced":      {"date": {"start": today}},
                      "Freshness":        {
                          "rich_text": [{"text": {"content": "\U0001f7e2 Hot"}}]
                      },
                  }
              },
              timeout=15,
          )
          patch.raise_for_status()
          print(f"✅ Notion updated: {slug} → {page_id} ({today})")
          PYEOF
