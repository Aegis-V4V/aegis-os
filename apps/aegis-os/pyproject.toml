[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegis-os"
version = "3.0.0"
description = "Aegis OS Podcasting 2.0 Engine & Brain API"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "duckdb>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = []
